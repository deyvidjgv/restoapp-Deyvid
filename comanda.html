<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestoApp - Comanda de cocina</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="comanda">

<header class="barra">
    <a href="index.html" class="marca">Resto<span>App</span></a>
    <nav>
        <a href="pedido.html" data-nav="pedido">Menú</a>
        <a href="comanda.html" data-nav="comanda">Comanda</a>
        <a href="admin.html" data-nav="admin">Panel administrativo</a>
    </nav>
    <div id="sesion" class="sesion oculto">
        Sesión: <strong id="sesionCorreo"></strong>
        <button id="salirBtn">Cerrar sesión</button>
    </div>
</header>

<main class="contenido">
    <h1>Comanda de cocina</h1>
    <p class="subtitulo">Pedidos por atender, del más antiguo al más reciente. Los entregados salen de la lista.</p>

    <p id="estado" class="subtitulo">Verificando sesión...</p>

    <div id="panel" class="oculto">
        <section class="tarjeta">
            <div id="comanda" class="platos">
                <p class="vacio">Cargando pedidos...</p>
            </div>
            <div id="comandaMsg" class="mensaje" role="status" aria-live="polite"></div>
        </section>
    </div>
</main>

<script src="js/starfield.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/comun.js"></script>
<script src="js/auth.js"></script>
<script src="js/ventas.js"></script>
<script src="js/comanda.js"></script>

</body>
</html>

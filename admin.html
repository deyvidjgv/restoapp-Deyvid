<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RestoApp - Administración</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin">

<div class="contenedor-principal">
    <nav class="site-nav">
        <a href="index.html" data-nav="index">Inicio</a>
        <a href="pedido.html" data-nav="pedido">Pedido</a>
        <a href="admin.html" id="navAdminLink" data-nav="admin" class="hidden">Admin</a>
        <a href="login.html" id="navLoginLink" data-nav="login">Acceso</a>
        <button id="navLogoutBtn" class="btn-secondary hidden">Cerrar sesión</button>
    </nav>

    <h2>RestoApp - Administración</h2>

    <p id="adminStatus" class="status-msg">Verificando sesión...</p>

    <!-- Formulario para crear productos (Mala práctica: sin validación segura) -->
    <!-- Oculto por defecto: solo se muestra cuando Firebase confirma la sesión (ver js/auth.js) -->
    <div id="productForm" class="product-form hidden">
        <h3>Crear producto (Mala práctica: sin validación segura)</h3>
        <div class="item">
            <label for="newName">Nombre</label>
            <input type="text" id="newName" placeholder="Ej: Bandeja Paisa">
        </div>
        <div class="item">
            <label for="newPrice">Precio ($)</label>
            <input type="number" id="newPrice" placeholder="Ej: 25000" min="0">
        </div>
        <button id="crearProductoBtn">Crear</button>
        <div id="prodMsg" class="prod-msg"></div>
    </div>
</div>

<script src="js/starfield.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/productos.js"></script>

</body>
</html>

<body data-page="admin">

<div class="contenedor-principal">
    <h2>RestoApp - Administración</h2>

    <!-- Formulario para crear productos (Mala práctica: sin validación segura) -->
    <div id="productForm" class="product-form">
        <h3>Crear producto (Mala práctica: sin validación segura)</h3>

    </div>
</div>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestoApp - Acceso</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="login">

<header class="barra">
    <a href="index.html" class="marca">Resto<span>App</span></a>
    <nav>
        <a href="pedido.html" data-nav="pedido">Menú</a>
        <a href="admin.html" data-nav="admin">Panel administrativo</a>
    </nav>
    <div id="sesion" class="sesion oculto">
        Sesión: <strong id="sesionCorreo"></strong>
        <button id="salirBtn">Cerrar sesión</button>
    </div>
</header>

<div class="centrado">
    <h1>Acceso</h1>
    <p class="subtitulo">Ingresa con tu cuenta de administrador para gestionar el menú.</p>

    <div class="tarjeta" id="loginForm">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="username">

        <label for="pass">Contraseña</label>
        <input type="password" id="pass" placeholder="Mínimo 6 caracteres" autocomplete="current-password">

        <button id="entrarBtn" class="principal">Ingresar</button>
        <div id="authMsg" class="mensaje" role="status" aria-live="polite"></div>
    </div>
</div>

<script src="js/starfield.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/comun.js"></script>
<script src="js/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RestoApp - Acceso</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">

<div class="contenedor-principal">
    <nav class="site-nav">
        <a href="index.html" data-nav="index">Inicio</a>
        <a href="pedido.html" data-nav="pedido">Pedido</a>
        <a href="admin.html" id="navAdminLink" data-nav="admin" class="hidden">Admin</a>
        <a href="login.html" id="navLoginLink" data-nav="login">Acceso</a>
        <button id="navLogoutBtn" class="btn-secondary hidden">Cerrar sesión</button>
    </nav>

    <h2>RestoApp - Acceso</h2>

    <div id="auth" class="auth-box">
        <h3>Acceso al sistema</h3>

        <div id="loginForm">
            <div class="item">
                <label for="email">Correo</label>
                <input type="email" id="email" placeholder="tu@correo.com">
            </div>
            <div class="item">
                <label for="pass">Contraseña</label>
                <input type="password" id="pass" placeholder="Mínimo 6 caracteres">
            </div>
            <button id="loginBtn">Ingresar</button>
            <button id="registerBtn" class="btn-secondary">Crear cuenta</button>
        </div>

        <p id="alreadyLoggedMsg" class="hidden">Ya tienes una sesión iniciada. Ve a <a href="admin.html">Admin</a> desde el menú de arriba.</p>

        <div id="authMsg" class="auth-msg"></div>
    </div>
</div>

<script src="js/starfield.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>

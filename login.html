<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RestoApp - Acceso</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">

<div class="contenedor-principal">
    <h2>RestoApp - Acceso</h2>
    <p class="back-link"><a href="index.html">&larr; Inicio</a></p>

    <div id="auth" class="auth-box">
        <h3>Acceso al sistema</h3>

        <div class="item">
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="tu@correo.com">
        </div>
        <div class="item">
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" placeholder="Mínimo 6 caracteres">
        </div>

        <button id="loginBtn">Ingresar</button>
        <button id="registerBtn" class="btn-secondary">Crear cuenta</button>
        <button id="logoutBtn" class="hidden">Cerrar sesión</button>
        <div id="authMsg" class="auth-msg"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>

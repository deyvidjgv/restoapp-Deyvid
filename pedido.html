<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestoApp - Menú</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="pedido">

<header class="barra">
    <a href="index.html" class="marca">Resto<span>App</span></a>
    <nav>
        <a href="pedido.html" data-nav="pedido">Menú</a>
        <a href="comanda.html" data-nav="comanda">Comanda</a>
        <a href="admin.html" data-nav="admin">Panel administrativo</a>
    </nav>
    <div id="sesion" class="sesion oculto">
        Sesión: <strong id="sesionCorreo"></strong>
        <button id="salirBtn">Cerrar sesión</button>
    </div>
</header>

<main class="contenido">
    <h1>Haz tu pedido</h1>
    <p class="subtitulo">Elige los platos, indica la cantidad y confirma tu comanda.</p>

    <div class="columnas">
        <section class="tarjeta">
            <h2>Menú disponible</h2>
            <div id="platos" class="platos">
                <p class="vacio">Cargando menú...</p>
            </div>
        </section>

        <div>
            <section class="tarjeta">
                <h2>Datos del pedido</h2>

                <label for="tipoPedido">Tipo de pedido</label>
                <select id="tipoPedido">
                    <option value="MESA">En mesa</option>
                    <option value="LLEVAR">Para llevar</option>
                    <option value="DOMICILIO">Domicilio</option>
                </select>

                <div id="campoMesa">
                    <label for="mesa">Número de mesa</label>
                    <input type="text" id="mesa" maxlength="10" placeholder="Ej: 4">
                </div>

                <label for="mesero">Mesero (opcional)</label>
                <input type="text" id="mesero" maxlength="40" placeholder="Quién toma el pedido">
            </section>

            <section class="tarjeta">
                <h2>Agregar plato</h2>

                <label for="seleccionado">Plato seleccionado</label>
                <input type="text" id="seleccionado" placeholder="Selecciona un plato del menú" readonly>

                <label for="precio">Precio unitario</label>
                <!-- Solo lectura: el precio lo define el administrador. -->
                <input type="text" id="precio" value="—" readonly>
                <p class="ayuda">Se completa automáticamente según el plato elegido.</p>

                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" value="1" min="1" max="99" step="1">

                <label for="notas">Notas para cocina (opcional)</label>
                <input type="text" id="notas" maxlength="120" placeholder="Ej: sin cebolla">

                <button id="agregarBtn" disabled>Agregar al pedido</button>
            </section>

            <section class="tarjeta">
                <h2>Tu pedido</h2>

                <table>
                    <thead>
                    <tr>
                        <th>Plato</th>
                        <th>Cant.</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="carritoBody"></tbody>
                </table>

                <div class="total">
                    <span>Total</span>
                    <span id="total">$ 0</span>
                </div>

                <button id="pedirBtn" class="principal" disabled>Confirmar pedido</button>
                <div id="pedidoMsg" class="mensaje" role="status" aria-live="polite"></div>
            </section>
        </div>
    </div>
</main>

<script src="js/starfield.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/comun.js"></script>
<script src="js/auth.js"></script>
<script src="js/menu.js"></script>
<script src="js/ventas.js"></script>
<script src="js/pedido.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RestoApp - Tomar Pedido</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="pedido">

<div class="contenedor-principal">
    <h2>RestoApp - Mesero V1.0</h2>
    <p class="back-link"><a href="index.html">&larr; Inicio</a></p>

    <div id="form">
        <div class="item">
            <label for="a">Plato</label>
            <select id="a">
                <option value="">--Cargando menú--</option>
            </select>
        </div>
        <div class="item">
            <label for="b">Cantidad</label>
            <input type="number" id="b" placeholder="Ej: 2" min="1">
        </div>
        <div class="item">
            <label for="p">Precio unitario ($)</label>
            <input type="number" id="p" placeholder="Ej: 15000" min="0">
        </div>
        <button id="btn">PROCESAR TODO</button>
    </div>

    <div id="res" class="resultado"></div>
</div>

<script src="js/menu.js"></script>
<script src="js/pedidos.js"></script>

</body>
</html>

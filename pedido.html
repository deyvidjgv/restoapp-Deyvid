<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestoApp - Menú</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="pedido">

<header class="barra">
    <a href="index.html" class="marca">Resto<span>App</span></a>
    <nav>
        <a href="pedido.html" data-nav="pedido">Menú</a>
        <a href="admin.html" data-nav="admin">Panel administrativo</a>
    </nav>
    <div id="sesion" class="sesion oculto">
        Sesión: <strong id="sesionCorreo"></strong>
        <button id="salirBtn">Cerrar sesión</button>
    </div>
</header>

<main class="contenido">
    <h1>Haz tu pedido</h1>
    <p class="subtitulo">Elige un plato del menú y define la cantidad que deseas.</p>

    <div class="columnas">
        <section class="tarjeta">
            <h2>Menú disponible</h2>
            <div id="platos" class="platos">
                <p class="vacio">Cargando menú...</p>
            </div>
        </section>

        <section class="tarjeta">
            <h2>Tu pedido</h2>

            <label for="seleccionado">Producto seleccionado</label>
            <input type="text" id="seleccionado" placeholder="Selecciona un plato del menú" readonly>

            <label for="precio">Precio unitario</label>
            <!-- Solo lectura: el precio lo define el administrador. -->
            <input type="text" id="precio" value="—" readonly>
            <p class="ayuda">Se completa automáticamente según el plato elegido.</p>

            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" value="1" min="1" max="99" step="1">

            <div class="total">
                <span>Total estimado</span>
                <span id="total">$ 0</span>
            </div>

            <button id="pedirBtn" class="principal" disabled>Hacer pedido</button>
            <div id="pedidoMsg" class="mensaje" role="status" aria-live="polite"></div>
        </section>
    </div>
</main>

<script src="js/starfield.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/comun.js"></script>
<script src="js/auth.js"></script>
<script src="js/menu.js"></script>
<script src="js/pedido.js"></script>

</body>
</html>

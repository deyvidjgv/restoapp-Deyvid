<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RestoApp - Tomar Pedido</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="pedido">

<div class="contenedor-principal">
    <nav class="site-nav">
        <a href="index.html" data-nav="index">Inicio</a>
        <a href="pedido.html" data-nav="pedido">Pedido</a>
        <a href="admin.html" id="navAdminLink" data-nav="admin" class="hidden">Admin</a>
        <a href="login.html" id="navLoginLink" data-nav="login">Acceso</a>
        <button id="navLogoutBtn" class="btn-secondary hidden">Cerrar sesión</button>
    </nav>

    <h2>RestoApp - Mesero V1.0</h2>

    <div id="form">
        <div class="item">
            <label for="a">Plato</label>
            <select id="a">
                <option value="">--Cargando menú--</option>
            </select>
        </div>
        <div class="item">
            <label for="b">Cantidad</label>
            <input type="number" id="b" placeholder="Ej: 2" min="1">
        </div>
        <div class="item">
            <label for="p">Precio unitario ($)</label>
            <input type="number" id="p" placeholder="Ej: 15000" min="0">
        </div>
        <button id="btn">PROCESAR TODO</button>
    </div>

    <div id="res" class="resultado"></div>
</div>

<script src="js/starfield.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/menu.js"></script>
<script src="js/pedidos.js"></script>

</body>
</html>
